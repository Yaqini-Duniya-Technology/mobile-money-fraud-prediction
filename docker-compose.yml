# ============================================================
# FraudGuard AI
# Docker Compose
# Version 3.1.1
# ============================================================

services:

  # ==========================================================
  # FASTAPI BACKEND
  # ==========================================================

  fraudguard-api:

    build:

      context: .

      dockerfile: Dockerfile

    container_name: fraudguard-api

    restart: unless-stopped

    env_file:

      - .env

    environment:

      API_HOST: 0.0.0.0

      API_PORT: 8001

    ports:

      - "8001:8001"

    volumes:

      - fraudguard_database:/app/data

    healthcheck:

      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health')"
        ]

      interval: 30s

      timeout: 10s

      retries: 3

      start_period: 20s


  # ==========================================================
  # STREAMLIT FRONTEND
  # ==========================================================

  fraudguard-streamlit:

    build:
      context: .
      dockerfile: Dockerfile.streamlit

    container_name: fraudguard-streamlit

    restart: unless-stopped

    depends_on:
      fraudguard-api:
        condition: service_healthy

    env_file:
      - .env

    environment:
      API_HOST: fraudguard-api
      API_PORT: 8001

    ports:
      - "8501:8501"

    volumes:
      - fraudguard_database:/app/data

# ============================================================
# PERSISTENT STORAGE
# ============================================================

volumes:

  fraudguard_database: